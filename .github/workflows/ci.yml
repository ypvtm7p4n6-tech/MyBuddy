name: CI

# Bouwt de app voor iOS en macOS, draait de tests en maakt screenshots van alle schermen.
# Draait bij elke push naar de ontwikkeltak en handmatig via "Run workflow".
on:
  push:
    branches: ["claude/**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Tests rekenlogica
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: swift test
        working-directory: CoreTests
        run: swift test

  live-network:
    if: github.event_name == 'workflow_dispatch'
    name: Live netwerktest (koersen en marktdata)
    runs-on: macos-26
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: swift test met internet
        working-directory: CoreTests
        env:
          MYBUDDY_LIVE: "1"
        run: swift test --filter "Live" 2>&1 | tail -n 250

  build-ios:
    name: Bouwen en testen iOS
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen
      - name: Bouwen voor iOS Simulator
        run: |
          set -o pipefail
          xcodebuild -project MyBuddy.xcodeproj -scheme MyBuddy \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | grep -E "error:|BUILD (SUCCEEDED|FAILED)|\*\* " | head -n 150
      - name: App-tests in de simulator
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available | grep -E "iPhone 1[0-9] Pro \(" | head -1 | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}')
          # De echte agenda van de simulator: de app krijgt vooraf toegang (EventKitCalendarTests leest een echte agenda).
          xcrun simctl boot "$UDID" || true
          xcrun simctl privacy "$UDID" grant calendar nl.mybuddy.app || echo "::warning::agendatoegang niet gezet"
          xcodebuild test -project MyBuddy.xcodeproj -scheme MyBuddy \
            -destination "id=$UDID" CODE_SIGNING_ALLOWED=NO 2>&1 \
            | grep -E "error:|Test Case.*(passed|failed)|Executed|TEST (SUCCEEDED|FAILED)|\*\* " | tail -n 200

  build-macos:
    name: Bouwen macOS
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen
      - name: Bouwen voor macOS
        run: |
          set -o pipefail
          xcodebuild -project MyBuddy.xcodeproj -scheme MyBuddy \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | grep -E "error:|BUILD (SUCCEEDED|FAILED)|\*\* " | head -n 150
      - name: Agenda-toegang staat in de app
        run: |
          # Zonder deze tekst stort de app in bij de toestemmingsvraag; zonder de build setting geeft de sandbox geen agenda.
          PLIST=$(find ~/Library/Developer/Xcode/DerivedData -path "*Build/Products/*/MyBuddy.app/Contents/Info.plist" 2>/dev/null | head -n 1)
          if [ -z "$PLIST" ]; then echo "::error::Info.plist van de gebouwde app niet gevonden"; exit 1; fi
          /usr/libexec/PlistBuddy -c "Print :NSCalendarsFullAccessUsageDescription" "$PLIST" \
            || { echo "::error::NSCalendarsFullAccessUsageDescription ontbreekt in $PLIST"; exit 1; }
          xcodebuild -project MyBuddy.xcodeproj -scheme MyBuddy -destination 'platform=macOS' -showBuildSettings 2>/dev/null \
            | grep -E "ENABLE_RESOURCE_ACCESS_CALENDARS = YES" \
            || { echo "::error::ENABLE_RESOURCE_ACCESS_CALENDARS staat niet aan"; exit 1; }

  ui-macos:
    name: UI-tests macOS
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen
      - name: De Mac-app doorklikken (zijbalk, Instellingen, Werkuren)
        run: |
          set -o pipefail
          xcodebuild test -project MyBuddy.xcodeproj -scheme MyBuddyMacUITests -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= 2>&1 \
            | grep -E "error:|Test Case|Executed|\*\* " | tail -n 60

  screenshots:
    if: github.event_name == 'workflow_dispatch'
    name: Screenshots
    runs-on: macos-26
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen
      - name: Screenshots maken
        run: scripts/ci-screenshots.sh screenshots
      - name: Zoomovergang en zijbalk in de echte app
        run: |
          mkdir -p screenshots
          PHONE=$(xcrun simctl list devices available | grep -E "iPhone 1[0-9] Pro \(" | head -1 | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}')
          TEST_RUNNER_SHOT_DIR="$PWD/screenshots" xcodebuild test -project MyBuddy.xcodeproj -scheme MyBuddy \
            -destination "id=$PHONE" -only-testing:MyBuddyUITests/ZoomFramesUITests CODE_SIGNING_ALLOWED=NO 2>&1 \
            | grep -E "error:|Test Case|\*\* " | tail -n 20 || true
          PAD=$(xcrun simctl list devices available | grep -E "iPad Pro" | head -1 | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}')
          xcodebuild test -project MyBuddy.xcodeproj -scheme MyBuddy \
            -destination "id=$PAD" -only-testing:MyBuddyUITests/SidebarUITests CODE_SIGNING_ALLOWED=NO 2>&1 \
            | grep -E "error:|Test Case|\*\* " | tail -n 20 || true
          ls screenshots | grep zoom || echo "geen zoombeelden"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots
      - name: Screenshots publiceren op de tak ci-screenshots
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git worktree add --orphan -b ci-screenshots ../shots
          cp screenshots/*.png ../shots/ || true
          cd ../shots
          git add -A
          git commit -m "Screenshots van ${GITHUB_SHA}" || true
          git push --force origin ci-screenshots
